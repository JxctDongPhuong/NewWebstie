name: React App CI/CD Pipeline

# 1. Kích hoạt khi có Push hoặc Pull Request vào nhánh main / master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =======================================================
  # JOB 1: CI (Kiểm tra chất lượng mã nguồn & Build thử)
  # =======================================================
  build-and-test:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn về máy ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Node.js và bật cơ chế cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # hoặc 22 tùy dự án
          cache: 'npm'     # đổi thành 'pnpm' hoặc 'yarn' nếu dự án dùng pnpm/yarn

      # Bước 3: Cài đặt dependencies sạch (dùng npm ci hoặc pnpm install)
      - name: Install dependencies
        run: npm ci

      # Bước 4: Kiểm tra Linter cú pháp React/JSX
      - name: Run Linter
        run: npm run lint --if-present

      # Bước 5: Thử nghiệm Build React / Next.js để phát hiện lỗi Compile/TypeScript
      - name: Build Project
        run: npm run build

  # =======================================================
  # JOB 2: CD (Đóng gói Docker & Đẩy lên Docker Hub)
  # =======================================================
  docker-deploy:
    name: Build & Push Docker Image
    needs: build-and-test # Chỉ chạy khi Job 1 (Build & Test) thành công
    runs-on: ubuntu-latest
    # Chỉ đẩy lên Docker Hub khi push vào nhánh chính
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Chuẩn bị môi trường Docker Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào Docker Hub qua GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push Image lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webviethan:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webviethan:${{ github.sha }}
