name: Landing Page CI/CD

on:
  pull_request:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/smart-home-sh/demowebou

concurrency:
  group: landing-page-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and Build
    runs-on:
      - self-hosted
      - k3s
      - staging
      - shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  publish:
    name: Publish Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - k3s
      - staging
      - shared
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image ref
        id: image
        run: echo "image_ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_ref }}

  promote:
    name: Promote to Staging Infra
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - k3s
      - staging
      - shared
    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: Smart-Home-SH/infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infrastructure

      - name: Update landing page image tag
        working-directory: infrastructure
        run: ./scripts/update-image-tag.sh demowebou "${{ needs.publish.outputs.image_ref }}"

      - name: Commit and push infra change
        working-directory: infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/patch-demowebou-image.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: promote demowebou image ${GITHUB_SHA}"
          git push
